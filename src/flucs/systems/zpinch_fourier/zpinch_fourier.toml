[dimensions]
Lx = 12.566370614359172
Ly = 6.283185307179586
Lz = 6.283185307179586

[parameters]
# Point A2 by default
kb = 0.28284271
kP = 2.2627417

[timestepping]
method = "ssprk3e"

[time]
max_cfl = 0.5

[init]
method = "white_noise"
amplitude = 1e-5
# for method = "single_mode": list of [kx, ky, kz] with ky >= 0
modes = []
eigenvector = true
# for method = "streamer": box energy of the eigenmode and of the white noise
energy = 1.0
noise_energy = 1e-6
# for method = "curvy3d_snapshot": curvy3d .nc file and snapshot index
file = ""
index = 0

# Stage 4a: time-based outputs (zpinch_output.py). save_time > 0 makes the
# output time-based (records at multiples of save_time); sample_time > 0 makes
# diagnostics with a sample() method (zp_maps, zp_streamer_kzkx) average their
# samples over each record window. save_steps = steps between time checks.
[output.0d]
save_time = -1.0
sample_time = -1.0

[output.1d]
save_time = -1.0
sample_time = -1.0

[output.2d]
save_time = -1.0
sample_time = -1.0

[output.maps]
save_steps = -1
diags = []
type = "netcdf4"
save_time = -1.0
sample_time = -1.0

[output.kpar]
save_steps = -1
diags = []
type = "netcdf4"
save_time = -1.0
sample_time = -1.0

[output.slices]
